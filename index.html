<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>NZ Power Factor Explorer</title>
  <meta name="description" content="How are power factors changing across NZ distribution networks? Animated scatter plots for 29 EDBs from 1997 to 2025.">
  <style>
    /* Base styles */
    :root {
      --blue-dark: #003366;
      --blue-mid: #0066b3;
      --blue-light: #e6f0fa;
      --bg-primary: #ffffff;
      --bg-secondary: #f8f9fa;
      --text-primary: #212529;
      --text-secondary: #6c757d;
      --border: #dee2e6;
      --space-xs: 0.25rem;
      --space-sm: 0.5rem;
      --space-md: 1rem;
      --space-lg: 1.5rem;
      --space-xl: 2rem;
    }
    *, *::before, *::after { box-sizing: border-box; }
    body {
      margin: 0;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
      font-size: 16px; line-height: 1.5;
      color: var(--text-primary);
      background: var(--bg-secondary);
    }
    a { color: var(--blue-mid); text-decoration: none; }
    a:hover { text-decoration: underline; }

    .tool-nav {
      background: var(--blue-dark);
      color: white;
      padding: var(--space-sm) var(--space-md);
      display: flex;
      align-items: center;
      gap: var(--space-md);
      position: sticky;
      top: 0;
      z-index: 100;
    }
    .nav-home {
      color: rgba(255,255,255,0.8);
      font-size: 0.9rem;
    }
    .nav-home:hover { color: white; text-decoration: none; }
    .nav-title { font-weight: 600; flex: 1; }
    .data-status {
      display: inline-block;
      font-size: 0.8rem;
      color: var(--text-secondary);
      background: var(--bg-secondary);
      padding: var(--space-xs) var(--space-sm);
      border-radius: 4px;
    }
    .site-footer {
      background: var(--blue-dark);
      color: rgba(255,255,255,0.7);
      text-align: center;
      padding: var(--space-lg);
      margin-top: var(--space-xl);
    }
    .site-footer a { color: rgba(255,255,255,0.9); }

    /* Page-specific styles */
    .pf-controls {
      background: var(--bg-primary);
      border-bottom: 1px solid var(--border);
      padding: var(--space-sm) var(--space-md);
      display: flex;
      align-items: center;
      gap: var(--space-md);
      flex-wrap: wrap;
    }
    .pf-controls label {
      font-weight: 600;
      font-size: 0.9rem;
      color: var(--text-secondary);
    }
    .pf-controls select {
      padding: 6px 12px;
      border: 1px solid var(--border);
      border-radius: 4px;
      font-size: 0.95rem;
      background: var(--bg-primary);
      min-width: 260px;
    }
    #chartContainer {
      position: relative;
      width: 100%;
      flex: 1;
      min-height: 500px;
    }
    .loading-overlay {
      position: absolute;
      top: 0; left: 0; right: 0; bottom: 0;
      background: rgba(255,255,255,0.85);
      display: flex;
      align-items: center;
      justify-content: center;
      z-index: 50;
      font-size: 1.1rem;
      color: var(--text-secondary);
    }
    .loading-overlay.hidden { display: none; }
    .attribution {
      text-align: center;
      padding: var(--space-sm) var(--space-md);
      font-size: 0.85rem;
      color: var(--text-secondary);
      background: var(--bg-primary);
      border-top: 1px solid var(--border);
    }
    .page-wrapper {
      display: flex;
      flex-direction: column;
      min-height: 100vh;
    }
    main {
      flex: 1;
      display: flex;
      flex-direction: column;
    }
    @media (max-width: 768px) {
      .pf-controls select { min-width: 200px; }
      #chartContainer { min-height: 400px; }
    }
  </style>
</head>
<body>
  <div class="page-wrapper">
    <nav class="tool-nav">
      <span class="nav-title">NZ Power Factor Explorer</span>
      <span class="data-status" id="dataStatus">Loading...</span>
    </nav>

    <div class="pf-controls">
      <label for="entitySelect">Network:</label>
      <select id="entitySelect">
        <option value="">Loading...</option>
      </select>
    </div>

    <main>
      <div id="chartContainer">
        <div class="loading-overlay" id="loadingOverlay">Loading data...</div>
        <div id="plotlyChart" style="width:100%; height:100%;"></div>
      </div>
      <div class="attribution">
        Data source: <a href="https://www.emi.ea.govt.nz">Electricity Authority EMI</a>
        &middot; Half-hourly metered P and Q at grid exit points, 1997&ndash;2025
      </div>
    </main>

    <footer class="site-footer">
      <p>Data source: <a href="https://www.emi.ea.govt.nz">Electricity Authority EMI</a></p>
    </footer>
  </div>

  <script src="https://cdn.plot.ly/plotly-2.35.2.min.js" charset="utf-8"></script>
  <script>
    // State
    let manifest = null;
    const dataCache = new Map();
    let currentCode = null;

    // Category names and colors (loaded from manifest)
    let CATEGORIES = [];
    let CATEGORY_COLORS = [];

    // --- Utility functions ---

    function computePFTicks(pfMin, pfMax) {
      const vals = [];
      const text = [];
      const range = pfMax - pfMin;
      const step = range > 0.08 ? 0.02 : 0.01;

      let v = Math.ceil(pfMin / step) * step;
      while (v <= pfMax + step * 0.5) {
        const rounded = Math.round(v * 1000) / 1000;
        vals.push(rounded);
        if (Math.abs(rounded - 1.0) < 0.0005) {
          text.push('1.0');
        } else if (rounded > 1.0) {
          const display = (2 - rounded).toFixed(2);
          text.push(display + ' lead');
        } else {
          text.push(rounded.toFixed(2));
        }
        v += step;
      }
      return { vals, text };
    }

    function makeTitle(entity, year) {
      const stats = entity.stats[String(year)];
      if (!stats) return entity.display_name + ' \u2014 ' + year;
      return (
        entity.display_name + ' \u2014 ' + year + '<br>' +
        '<span style="font-size:14px; color:#555">' +
        'Mean PF: ' + stats.display_pf + '  \u00b7  ' +
        'Leading ' + stats.pct_leading.toFixed(1) + '% of the time</span>'
      );
    }

    // --- Chart building ---

    function buildChart(entity, yearData) {
      const chartDiv = document.getElementById('plotlyChart');
      const years = entity.years;
      const axis = entity.axis;
      const pfTicks = computePFTicks(axis.pf_min, axis.pf_max);

      const firstYear = years[0];
      const firstData = yearData[String(firstYear)];
      const traces = buildTraces(firstData);

      const layout = {
        title: {
          text: makeTitle(entity, firstYear),
          font: { size: 20 },
          x: 0.5, xanchor: 'center',
          y: 0.97, yanchor: 'top'
        },
        template: 'plotly_white',
        xaxis: {
          title: { text: 'Active Power (MW)', font: { size: 16 } },
          range: [-axis.p_max * 0.03, axis.p_max],
          tickfont: { size: 12 }
        },
        yaxis: {
          title: { text: 'Power Factor', font: { size: 16 } },
          range: [axis.pf_min, axis.pf_max],
          tickvals: pfTicks.vals,
          ticktext: pfTicks.text,
          tickfont: { size: 12 }
        },
        shapes: [{
          type: 'line', x0: 0, x1: 1, xref: 'paper',
          y0: 1.0, y1: 1.0,
          line: { dash: 'dash', color: 'grey', width: 1 }
        }],
        legend: {
          title: { text: 'Season / Time' },
          font: { size: 11 },
          x: 1.0, xanchor: 'left', y: 1.0
        },
        margin: { l: 70, r: 160, t: 70, b: 80 },
        autosize: true
      };

      const frames = years.map(year => {
        const yd = yearData[String(year)];
        return {
          name: String(year),
          data: buildFrameData(yd),
          layout: {
            title: { text: makeTitle(entity, year) }
          }
        };
      });

      const sliders = [{
        active: 0,
        currentvalue: { prefix: 'Year: ', font: { size: 16 } },
        pad: { t: 50, l: 120 },
        x: 0.08, len: 0.9,
        steps: years.map(year => ({
          label: String(year),
          method: 'animate',
          args: [[String(year)], {
            frame: { duration: 600, redraw: true },
            mode: 'immediate',
            transition: { duration: 300 }
          }]
        }))
      }];

      const updatemenus = [{
        type: 'buttons',
        showactive: false,
        x: 0.0, y: -0.08,
        xanchor: 'left', yanchor: 'top',
        buttons: [
          {
            label: '\u25b6 Play',
            method: 'animate',
            args: [null, {
              frame: { duration: 800, redraw: true },
              fromcurrent: true,
              transition: { duration: 400 }
            }]
          },
          {
            label: '\u23f8 Pause',
            method: 'animate',
            args: [[null], {
              frame: { duration: 0, redraw: false },
              mode: 'immediate',
              transition: { duration: 0 }
            }]
          }
        ]
      }];

      layout.sliders = sliders;
      layout.updatemenus = updatemenus;

      Plotly.react(chartDiv, traces, layout, { responsive: true })
        .then(() => Plotly.addFrames(chartDiv, frames));
    }

    function buildTraces(yd) {
      if (!yd) return [];
      return CATEGORIES.map((cat, i) => {
        const indices = [];
        for (let j = 0; j < yd.c.length; j++) {
          if (yd.c[j] === i) indices.push(j);
        }
        return {
          x: indices.map(j => yd.P[j]),
          y: indices.map(j => yd.pf[j]),
          mode: 'markers',
          type: 'scatter',
          name: cat,
          marker: { size: 4, color: CATEGORY_COLORS[i], opacity: 0.5 },
          showlegend: true
        };
      });
    }

    function buildFrameData(yd) {
      if (!yd) return CATEGORIES.map(() => ({ x: [], y: [] }));
      return CATEGORIES.map((cat, i) => {
        const indices = [];
        for (let j = 0; j < yd.c.length; j++) {
          if (yd.c[j] === i) indices.push(j);
        }
        return {
          x: indices.map(j => yd.P[j]),
          y: indices.map(j => yd.pf[j])
        };
      });
    }

    // --- Data loading ---

    async function fetchJSON(url) {
      const resp = await fetch(url);
      if (!resp.ok) throw new Error('Failed to fetch ' + url);
      return resp.json();
    }

    async function loadEntity(code) {
      if (dataCache.has(code)) return dataCache.get(code);
      const data = await fetchJSON('data/' + code + '.json');
      dataCache.set(code, data);
      return data;
    }

    // --- UI ---

    function populateDropdown() {
      const select = document.getElementById('entitySelect');
      select.innerHTML = '';

      const national = manifest.entities.filter(e => e.type === 'national');
      const regulated = manifest.entities.filter(e => e.type === 'regulated');
      const exempt = manifest.entities.filter(e => e.type === 'exempt');

      function addGroup(label, entities) {
        const group = document.createElement('optgroup');
        group.label = label;
        entities.forEach(e => {
          const opt = document.createElement('option');
          opt.value = e.code;
          opt.textContent = e.code === 'NZ' ? e.name : e.name + ' (' + e.code + ')';
          group.appendChild(opt);
        });
        select.appendChild(group);
      }

      addGroup('National', national);
      addGroup('Regulated EDBs (' + regulated.length + ')', regulated);
      addGroup('Consumer-Owned EDBs (' + exempt.length + ')', exempt);

      select.value = 'NZ';
    }

    function showLoading(msg) {
      const el = document.getElementById('loadingOverlay');
      el.textContent = msg || 'Loading...';
      el.classList.remove('hidden');
    }

    function hideLoading() {
      document.getElementById('loadingOverlay').classList.add('hidden');
    }

    async function switchEntity(code) {
      if (code === currentCode) return;
      currentCode = code;

      showLoading('Loading ' + code + '...');
      try {
        const yearData = await loadEntity(code);
        const entity = manifest.entities.find(e => e.code === code);
        if (!entity) throw new Error('Entity not found: ' + code);
        buildChart(entity, yearData);
        hideLoading();
      } catch (err) {
        console.error(err);
        document.getElementById('loadingOverlay').textContent = 'Error loading data';
      }
    }

    // --- Init ---

    async function init() {
      try {
        manifest = await fetchJSON('data/manifest.json');
        CATEGORIES = manifest.categories;
        CATEGORY_COLORS = manifest.category_colors;

        const gen = new Date(manifest.generated);
        const firstYear = manifest.entities[0].years[0];
        const lastYear = manifest.entities[0].years.slice(-1)[0];
        document.getElementById('dataStatus').textContent =
          'Data: ' + firstYear + '\u2013' + lastYear;

        populateDropdown();

        document.getElementById('entitySelect').addEventListener('change', function() {
          switchEntity(this.value);
        });

        await switchEntity('NZ');

      } catch (err) {
        console.error('Init failed:', err);
        document.getElementById('loadingOverlay').textContent = 'Error loading manifest';
      }
    }

    window.addEventListener('resize', () => {
      const chartDiv = document.getElementById('plotlyChart');
      if (chartDiv && chartDiv.data) {
        Plotly.Plots.resize(chartDiv);
      }
    });

    init();
  </script>
</body>
</html>
